services:
  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:55439:5432"
    environment:
      POSTGRES_DB: harness_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set a disposable admin password}"
      HARNESS_TEST_PASSWORD: "${HARNESS_TEST_PASSWORD:?set a distinct disposable test password}"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d harness_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
